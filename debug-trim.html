<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Trim Whitespace - ID Cards Composer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-section {
            background: #f7f9fc;
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            background: #eef2ff;
            border-color: #764ba2;
        }

        .upload-section input {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            background: #f7f9fc;
            padding: 20px;
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        .control-group .value-display {
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .image-panel {
            background: #f7f9fc;
            border-radius: 12px;
            padding: 20px;
        }

        .image-panel h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .image-container {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .image-container canvas {
            max-width: 100%;
            height: auto;
            display: block;
            image-rendering: crisp-edges;
        }

        .stats {
            background: white;
            border-radius: 8px;
            padding: 15px;
            font-size: 13px;
        }

        .stats div {
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .stats div:last-child {
            border-bottom: none;
        }

        .stats strong {
            color: #667eea;
            display: inline-block;
            width: 140px;
        }

        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .highlight {
            background: #fff9c4;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Debug Trim Whitespace</h1>
        <p class="subtitle">Testa e ottimizza i parametri di trim per fronte e retro</p>

        <div class="upload-section" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*">
            <h3>📁 Carica un'immagine con fronte e retro</h3>
            <p>Click qui o trascina un file</p>
        </div>

        <div class="controls">
            <div class="control-group" style="grid-column: 1 / -1;">
                <label>⚡ Preset rapidi</label>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                    <button class="button" onclick="applyPreset('default')" style="flex: 1; min-width: 150px;">Corrente (252, 1%, 1px)</button>
                    <button class="button" onclick="applyPreset('aggressive')" style="flex: 1; min-width: 150px;">Aggressivo (245, 0.5%, 0px)</button>
                    <button class="button" onclick="applyPreset('moderate')" style="flex: 1; min-width: 150px;">Moderato (248, 1%, 2px)</button>
                    <button class="button" onclick="applyPreset('gentle')" style="flex: 1; min-width: 150px;">Gentile (250, 2%, 3px)</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>White Threshold (0-255)</label>
                <input type="range" id="whiteThreshold" min="240" max="255" value="252" step="1">
                <span class="value-display" id="whiteThresholdValue">252</span>
            </div>

            <div class="control-group">
                <label>Min Pixels % (0-10%)</label>
                <input type="range" id="minPixels" min="0" max="10" value="1" step="0.1">
                <span class="value-display" id="minPixelsValue">1.0%</span>
            </div>

            <div class="control-group">
                <label>Margin (0-10px)</label>
                <input type="range" id="margin" min="0" max="10" value="1" step="1">
                <span class="value-display" id="marginValue">1px</span>
            </div>

            <div class="control-group" style="align-items: center; justify-content: center;">
                <button class="button" id="reprocessBtn" style="width: 100%;">🔄 Rielabora</button>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        let currentImage = null;
        let documents = [];

        // Setup upload
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#eef2ff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '#f7f9fc';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f7f9fc';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        // Controls
        const whiteThreshold = document.getElementById('whiteThreshold');
        const minPixels = document.getElementById('minPixels');
        const margin = document.getElementById('margin');
        const reprocessBtn = document.getElementById('reprocessBtn');

        whiteThreshold.addEventListener('input', () => {
            document.getElementById('whiteThresholdValue').textContent = whiteThreshold.value;
        });

        minPixels.addEventListener('input', () => {
            document.getElementById('minPixelsValue').textContent = minPixels.value + '%';
        });

        margin.addEventListener('input', () => {
            document.getElementById('marginValue').textContent = margin.value + 'px';
        });

        reprocessBtn.addEventListener('click', () => {
            if (currentImage) {
                processImage(currentImage);
            }
        });

        function handleFile() {
            const file = fileInput.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = () => {
                currentImage = img;
                processImage(img);
            };
            img.src = URL.createObjectURL(file);
        }

        function processImage(img) {
            console.log('Processing image:', img.width, 'x', img.height);

            // Simple split in half for testing
            const halfHeight = Math.floor(img.height / 2);

            documents = [
                {
                    name: 'FRONTE',
                    x: 0,
                    y: 0,
                    width: img.width,
                    height: halfHeight
                },
                {
                    name: 'RETRO',
                    x: 0,
                    y: halfHeight,
                    width: img.width,
                    height: halfHeight
                }
            ];

            displayResults(img);
        }

        function displayResults(img) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            const comparison = document.createElement('div');
            comparison.className = 'comparison';

            documents.forEach(doc => {
                const panel = createPanel(img, doc);
                comparison.appendChild(panel);
            });

            resultsDiv.appendChild(comparison);
        }

        function createPanel(img, doc) {
            const panel = document.createElement('div');
            panel.className = 'image-panel';

            const title = document.createElement('h3');
            title.textContent = doc.name;
            panel.appendChild(title);

            // Original
            const originalContainer = document.createElement('div');
            originalContainer.className = 'image-container';
            const originalCanvas = document.createElement('canvas');
            originalCanvas.width = doc.width;
            originalCanvas.height = doc.height;
            const originalCtx = originalCanvas.getContext('2d');
            originalCtx.drawImage(img, doc.x, doc.y, doc.width, doc.height, 0, 0, doc.width, doc.height);
            originalContainer.appendChild(originalCanvas);

            const originalLabel = document.createElement('div');
            originalLabel.style.cssText = 'margin-bottom: 10px; font-weight: 600; color: #666;';
            originalLabel.textContent = 'Originale';
            panel.appendChild(originalLabel);
            panel.appendChild(originalContainer);

            // Trimmed
            const trimResult = trimWhitespace(originalCanvas);

            const trimmedContainer = document.createElement('div');
            trimmedContainer.className = 'image-container';
            trimmedContainer.appendChild(trimResult.canvas);

            const trimmedLabel = document.createElement('div');
            trimmedLabel.style.cssText = 'margin: 20px 0 10px; font-weight: 600; color: #667eea;';
            trimmedLabel.textContent = 'Dopo Trim';
            panel.appendChild(trimmedLabel);
            panel.appendChild(trimmedContainer);

            // Stats
            const stats = document.createElement('div');
            stats.className = 'stats';
            stats.innerHTML = `
                <div><strong>Originale:</strong> ${doc.width} × ${doc.height} px</div>
                <div><strong>Dopo trim:</strong> <span class="highlight">${trimResult.width} × ${trimResult.height} px</span></div>
                <div><strong>Rimosso Top:</strong> ${trimResult.removedTop} px</div>
                <div><strong>Rimosso Bottom:</strong> ${trimResult.removedBottom} px</div>
                <div><strong>Rimosso Left:</strong> ${trimResult.removedLeft} px</div>
                <div><strong>Rimosso Right:</strong> ${trimResult.removedRight} px</div>
                <div><strong>Aspect Ratio:</strong> ${(trimResult.width / trimResult.height).toFixed(3)}</div>
            `;
            panel.appendChild(stats);

            return panel;
        }

        function trimWhitespace(sourceCanvas) {
            const width = sourceCanvas.width;
            const height = sourceCanvas.height;
            const ctx = sourceCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            let top = 0, bottom = height - 1;
            let left = 0, right = width - 1;

            const whiteThresholdValue = parseInt(whiteThreshold.value);
            const minPixelsThreshold = parseFloat(minPixels.value) / 100;
            const marginValue = parseInt(margin.value);

            const countNonWhitePixels = (startRow, endRow, startCol, endCol) => {
                let count = 0;
                for (let row = startRow; row <= endRow; row++) {
                    for (let col = startCol; col <= endCol; col++) {
                        const idx = (row * width + col) * 4;
                        const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        if (brightness < whiteThresholdValue) count++;
                    }
                }
                return count;
            };

            // Find top
            for (let row = 0; row < height; row++) {
                const nonWhite = countNonWhitePixels(row, row, 0, width - 1);
                if (nonWhite > width * minPixelsThreshold) {
                    top = row;
                    break;
                }
            }

            // Find bottom
            for (let row = height - 1; row >= 0; row--) {
                const nonWhite = countNonWhitePixels(row, row, 0, width - 1);
                if (nonWhite > width * minPixelsThreshold) {
                    bottom = row;
                    break;
                }
            }

            // Find left
            for (let col = 0; col < width; col++) {
                const nonWhite = countNonWhitePixels(0, height - 1, col, col);
                if (nonWhite > height * minPixelsThreshold) {
                    left = col;
                    break;
                }
            }

            // Find right
            for (let col = width - 1; col >= 0; col--) {
                const nonWhite = countNonWhitePixels(0, height - 1, col, col);
                if (nonWhite > height * minPixelsThreshold) {
                    right = col;
                    break;
                }
            }

            // Apply margin
            top = Math.max(0, top - marginValue);
            left = Math.max(0, left - marginValue);
            bottom = Math.min(height - 1, bottom + marginValue);
            right = Math.min(width - 1, right + marginValue);

            const trimmedWidth = right - left + 1;
            const trimmedHeight = bottom - top + 1;

            // Create trimmed canvas
            const trimmedCanvas = document.createElement('canvas');
            trimmedCanvas.width = trimmedWidth;
            trimmedCanvas.height = trimmedHeight;
            const trimmedCtx = trimmedCanvas.getContext('2d');

            trimmedCtx.drawImage(
                sourceCanvas,
                left, top, trimmedWidth, trimmedHeight,
                0, 0, trimmedWidth, trimmedHeight
            );

            return {
                canvas: trimmedCanvas,
                width: trimmedWidth,
                height: trimmedHeight,
                removedTop: top,
                removedBottom: height - 1 - bottom,
                removedLeft: left,
                removedRight: width - 1 - right
            };
        }

        // Preset configurations
        const presets = {
            default: { whiteThreshold: 252, minPixels: 1, margin: 1 },
            aggressive: { whiteThreshold: 245, minPixels: 0.5, margin: 0 },
            moderate: { whiteThreshold: 248, minPixels: 1, margin: 2 },
            gentle: { whiteThreshold: 250, minPixels: 2, margin: 3 }
        };

        window.applyPreset = function(presetName) {
            const preset = presets[presetName];
            if (!preset) return;

            whiteThreshold.value = preset.whiteThreshold;
            minPixels.value = preset.minPixels;
            margin.value = preset.margin;

            document.getElementById('whiteThresholdValue').textContent = preset.whiteThreshold;
            document.getElementById('minPixelsValue').textContent = preset.minPixels + '%';
            document.getElementById('marginValue').textContent = preset.margin + 'px';

            if (currentImage) {
                processImage(currentImage);
            }

            console.log(`📋 Preset "${presetName}" applicato: threshold=${preset.whiteThreshold}, minPixels=${preset.minPixels}%, margin=${preset.margin}px`);
        };

        console.log('🔬 Debug Trim ready!');
        console.log('Preset disponibili:', Object.keys(presets));
    </script>
</body>
</html>
