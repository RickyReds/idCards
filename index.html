<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Processor - Rilevamento e Rotazione Automatica</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🪪 ID Card Processor</h1>
            <p>Rileva, raddrizza e ottimizza automaticamente le tue carte d'identità</p>
        </header>

        <main>
            <!-- Drop Zone -->
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h2>Trascina qui le tue immagini</h2>
                    <p>oppure clicca per selezionarle</p>
                    <p class="supported-formats">Supporta: JPG, PNG, WebP</p>
                </div>
                <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
            </div>

            <!-- Processing Status -->
            <div id="processingStatus" class="processing-status" style="display: none;">
                <div class="spinner"></div>
                <p id="statusText">Processando immagini...</p>
            </div>

            <!-- Results Grid -->
            <div id="results" class="results-grid"></div>
        </main>

        <footer>
            <p>Apri la Console (F12) per vedere i dettagli del processo</p>
        </footer>
    </div>

    <script src="js/documentDetector.js"></script>
    <script src="js/imageProcessor.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
